# Table 3: full cascade, control re-run
# Generated from configs/cnn_mtl_config.yaml; identical to the config of
# the paper's component campaign (Table 3) run revision_control apart from paths and names.
# Train with: python train.py --config <this file> --data-root ... --output-root ...

# ------------------ General Project Information ------------------
project_name: "project_name"
experiment_name: "campaign_control"

# ------------------ Output Location ------------------
paths:
  # Base directory experiment folders (outputs/<model>_<timestamp>/) get created under.
  # No default on purpose: pass --output-root on the CLI (train.py / evaluate.py) or
  # override this key in a local config copy. Never hardcode a machine-specific path here.
  output_root: null

# ------------------ Dataset and Feature Definitions ------------------
dataset: "GuitarSet"
GuitarSet:
    # Directory of feature-enriched .npz files produced by extract_features.py.
    # No default on purpose: pass --data-root on the CLI (see train.py / evaluate.py)
    # or override this key in a local config copy. Never hardcode a machine-specific path here.
    data_root: null
    feature_to_file_map:
      hcqt: "hcqt.npy"
      mel: "mel.npy"
      power: "power.npy"

feature_definitions:
  cqt: {key: "cqt", in_channels: 1, num_freq: 144}
  hcqt: {key: "hcqt", in_channels: 6, num_freq: 144}
  mel: {key: "mel", in_channels: 1, num_freq: 256}
  power: {key: "power", in_channels: 1, num_freq: 1}

# ------------------ Data Loading and Processing Parameters ------------------
data:
  active_preparation_mode: "framify"
  framify_chunk_size: 500
  framify_window_size: 19

  augmentation:
    enabled: false
    freq_masking_param: 24
    time_masking_param: 30

  active_features:
    hcqt: true
    mel: true
    cqt: false
    power: false

  target_keys:
    tablature: true
    hand_pos_target: true
    activity_target: true
    pitch_class_target: true
    multipitch_target: true
    onset_target: false

  batch_size: 4
  num_workers: 2
  random_state: 42
  hop_length: 512
  sample_rate: 22050

# ------------------ Model Selection and Parameters ------------------
model:
  name: "cnn_mtl"
  params:
    num_classes: 21
    use_projection_layer: true
    projection_output_size: 256

    # --- BACKBONE ---
    backbone:
      type: "MultiScaleSE"
      kernels: [[3,3], [5,5], [1,9]]
      filters: [32, 64, 128]
      use_se_block: true
      dropout: 0.25

    # --- HEADS ---
    # hand_position is the paper's fret-region estimate: the mean fret of the active
    # fretted notes, quantized into 5 classes (eq. 1). The key keeps its original name
    # so existing feature files and checkpoints stay compatible.
    heads:
      tablature: {enabled: true}

      hand_position: {enabled: true, num_classes: 5}
      string_activity: {enabled: true}
      pitch_class: {enabled: true, num_classes: 12}
      multipitch: {enabled: true}
      onset: {enabled: false}

# ------------------ Instrument Properties (Single Source of Truth) ------------------
instrument:
  tuning: [40, 45, 50, 55, 59, 64]
  min_midi: 40
  max_midi: 88
  num_frets: 19
  num_strings: 6
  silence_class: 20

# ------------------ Loss Function Settings ------------------
loss:
  weighting_strategy: "uncertainty" # "uncertainty" or "static"

  grad_cos_sim:
    enabled: true
    threshold: 0.0

  tablature_loss:
    type: "FocalLoss"
    params: {gamma: 2.0, ignore_index: -1}

  hand_position_loss:
    enabled: true
    type: "CrossEntropyLoss"
    weight: 0.4

  string_activity_loss:
    enabled: true
    type: "BCEWithLogitsLoss"
    weight: 0.4

  pitch_class_loss:
    enabled: true
    type: "BCEWithLogitsLoss"
    weight: 0.4

  multipitch_loss:
    enabled: true
    type: "BCEWithLogitsLoss"
    weight: 0.4

  onset_loss:
    enabled: false
    type: "BCEWithLogitsLoss"
    weight: 0.4

# ------------------ Training Parameters ------------------
training:
  optimizer:
    active_optimizer: "AdamW"
    configurations:
      Adam:
        differential_lr: true
        params:
          backbone_lr: 0.0001
          head_lr: 0.0005
          loss_lr: 0.001
          weight_decay: 0.0
      AdamW:
        differential_lr: true
        params:
          backbone_lr: 0.0003
          head_lr: 0.0006
          loss_lr: 0.001
          weight_decay: 0.01

  scheduler:
    active_scheduler: "ReduceLROnPlateau" # "ReduceLROnPlateau", "StepLR", or "none"
    configurations:
      ReduceLROnPlateau: {params: {monitor: "val_tab_f1", mode: "max", factor: 0.5, patience: 6, min_lr: 1.0e-6}}
      StepLR: {params: {step_size: 10, gamma: 0.5}}

  epochs: 200
  # Component campaign protocol: reseed at the start of every fold.
  reseed_each_fold: true
  device: "cuda"
  use_mixed_precision: true

  early_stopping:
    enabled: true
    monitor: "val_tab_f1"
    patience: 12
    min_delta: 0.0001
    mode: "max"

# ------------------ Post-Processing Settings ------------------
post_processing:
  min_duration_frames: 0 # Short note filter (0 = disabled)
  prediction_threshold: 0.3 # Probability threshold

# ------------------ Evaluation Metrics Settings ------------------
metrics:
  include_silence: false # Include/exclude silence class in metrics

# ------------------ Logging and Checkpoint Settings ------------------
logging_and_checkpointing:
  use_tensorboard: True
  resume_from_checkpoint: null
  log_epoch_summary: True

  # ------------------------------------------------------------------------------------
  # This section allows for granular control over log verbosity for each part of the project.
  # The hierarchy is: DEBUG > INFO > WARNING > ERROR > CRITICAL.
  # Setting a level to "DEBUG" will show all messages (DEBUG, INFO, WARNING, etc.).
  # Setting it to "INFO" will show INFO, WARNING, ERROR, etc., but hide DEBUG messages.
  # ------------------------------------------------------------------------------------
  log_levels:
    __main__: "INFO"
    src.trainer: "INFO"
    src.data_loader: "INFO"
    src.models.cnn_mtl: "DEBUG"
    src.utils.losses: "INFO"
    src.utils.metrics: "INFO"
    src.utils.agt_tools: "INFO"
    src.utils.experiment: "INFO"
    src.utils.analyze_errors: "INFO"
